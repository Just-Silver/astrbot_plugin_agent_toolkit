line-length = 120
target-version = "py310"

# Markdown code fences are documentation content; reformatting them would
# silently rewrite specs and plans.
extend-exclude = ["*.md"]

[lint]
select = ["F", "W", "E", "ASYNC", "C4", "Q", "I", "UP"]
ignore = [
    "F403",
    "F405",
    "E501",
    "ASYNC230",
    "ASYNC240",
]
