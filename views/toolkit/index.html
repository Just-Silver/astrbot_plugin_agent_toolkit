<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toolkit</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="tk">
      <header class="tk-top">
        <span class="tk-title" id="heading">Agent Toolkit</span>
        <span class="tk-count" id="tool-count"></span>
      </header>

      <div class="tk-main">
        <aside class="tk-side">
          <div class="tk-side-label" id="tools-label">工具</div>
          <nav class="tk-list" id="tool-list"></nav>
        </aside>

        <section class="tk-content">
          <div class="tk-head">
            <span class="tk-name" id="tool-name"></span>
            <span class="tk-badge" id="tool-status"></span>
          </div>
          <p class="tk-desc" id="tool-desc"></p>

          <div class="tk-row">
            <input
              class="tk-input"
              id="url-input"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="https://example.com"
            />
            <button class="tk-btn" id="fetch-btn" type="button">抓取</button>
          </div>

          <div class="tk-adv">
            <label class="tk-field"
              ><span id="max-chars-label">字符上限</span>
              <input class="tk-num" id="max-chars" type="number" min="1000" max="50000" step="1000" value="8000"
            /></label>
            <label class="tk-field"
              ><span id="timeout-label">超时</span>
              <input class="tk-num" id="timeout" type="number" min="5" max="120" step="5" value="30" />
              <span id="seconds-label">秒</span></label
            >
            <span class="tk-fade" id="only-once">仅本次测试生效</span>
          </div>

          <div class="tk-meta" id="meta"></div>
          <p class="tk-error" id="error-line" hidden></p>
          <pre class="tk-out" id="output"></pre>
          <div class="tk-actions">
            <button class="tk-ghost" id="copy-btn" type="button">复制</button>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
